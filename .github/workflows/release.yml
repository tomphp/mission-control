name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Test
        run: make test

  tag:
    name: tag release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cog.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cog bump fails when there are no feat/fix commits since the last
      # tag (e.g. a docs/chore-only push). continue-on-error lets that
      # be treated as "no release needed" instead of failing the run -
      # every downstream job checks `needs.tag.outputs.version != ''`.
      - name: Bump version and tag
        id: cog
        continue-on-error: true
        uses: cocogitto/cocogitto-action@v3
        with:
          release: true
          git-user: 'Cog Bot'
          git-user-email: 'cog-bot@users.noreply.github.com'

  build-web:
    name: build web assets
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web bundle
        run: cd web && bun install --frozen-lockfile && bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [tag, build-web]
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          out="mission-control"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="mission-control.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "dist/${out}" ./cmd/mission-control

      - name: Package archive
        run: |
          name="mission-control_${{ needs.tag.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p out
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -q "../out/${name}.zip" mission-control.exe)
          else
            tar -czf "out/${name}.tar.gz" -C dist mission-control
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mission-control_${{ matrix.goos }}_${{ matrix.goarch }}
          path: out/*
          retention-days: 1

  publish:
    name: publish release
    needs: [tag, build]
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: mission-control_*
          path: out
          merge-multiple: true

      - name: Generate changelog
        uses: cocogitto/cocogitto-action@v3
        with:
          check: false

      - name: Generate changelog body
        run: |
          version="${{ needs.tag.outputs.version }}"
          cog changelog --at "${version#v}" -t full_hash > CHANGELOG_body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          body_path: CHANGELOG_body.md
          files: out/*
